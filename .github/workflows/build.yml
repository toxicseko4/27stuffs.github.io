name: Generate Repository Indices

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compress:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install compression tools
        run: sudo apt-get update && sudo apt-get install -y bzip2 xz-utils

      - name: Generate Compressed Package Indices
        run: |
          bzip2 -f -k -9 Packages
          xz -f -k -9 Packages

      - name: Commit compressed indices back to repo
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automated update: Packages.bz2 & Packages.xz"
